<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mommy Pakdo Baby</title>

<style>
* {
  box-sizing: border-box;
  touch-action: manipulation;
  user-select: none;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: linear-gradient(#70cfff, #d9f5ff);
}

#title {
  position: absolute;
  top: 15px;
  width: 100%;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #333;
  z-index: 10;
}

#score {
  position: absolute;
  top: 55px;
  left: 15px;
  background: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
  z-index: 10;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

#message {
  position: absolute;
  top: 95px;
  width: 100%;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  color: #333;
  z-index: 10;
}

.character {
  position: absolute;
  font-size: 50px;
  width: 60px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: transform 0.05s linear;
}

#phone {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #ff4757;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 12px 24px;
  font-size: 16px;
  font-weight: bold;
  z-index: 20;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div id="game">

  <div id="title">😂 Mommy Pakdo Baby 😂</div>

  <div id="score">
    Score: <span id="points">0</span>
  </div>

  <div id="message">
    Baby ko pakdo! 👶
  </div>

  <div id="baby" class="character">👶</div>
  <div id="mom" class="character">👩</div>

  <button id="phone">📱 RUN BABY!</button>

</div>

<script>
const game = document.getElementById("game");
const baby = document.getElementById("baby");
const mom = document.getElementById("mom");
const pointsText = document.getElementById("points");
const message = document.getElementById("message");
const button = document.getElementById("phone");

let points = 0;

// Screen ke beech mein initial positions set karte hain
let babyX = window.innerWidth / 2 - 50;
let babyY = window.innerHeight / 2 - 50;

let momX = window.innerWidth / 2 + 50;
let momY = window.innerHeight / 2 + 50;

function moveBaby() {
  const maxX = window.innerWidth - 70;
  const maxY = window.innerHeight - 140;

  babyX = 20 + Math.random() * (maxX - 40);
  babyY = 140 + Math.random() * (maxY - 180);

  baby.style.left = babyX + "px";
  baby.style.top = babyY + "px";

  points++;
  pointsText.textContent = points;

  message.textContent = "😂 Baby bhaag gaya! Pakdo!";
}

function moveMom() {
  const dx = babyX - momX;
  const dy = babyY - momY;

  momX += dx * 0.07;
  momY += dy * 0.07;

  mom.style.left = momX + "px";
  mom.style.top = momY + "px";

  checkDistance();
}

function checkDistance() {
  const distance = Math.sqrt(
    Math.pow(babyX - momX, 2) +
    Math.pow(babyY - momY, 2)
  );

  if (distance < 50) {
    message.textContent = "🎉 Mommy ne pakad liya! 🎉";
    points = 0;
    pointsText.textContent = points;

    setTimeout(() => {
      message.textContent = "👶 Baby phir se bhaag gaya!";
      moveBaby();
    }, 1000);
  }
}

// Button click ya kahin bhi tap karne par baby bhaagega
button.addEventListener("click", (e) => {
  e.stopPropagation();
  moveBaby();
});

game.addEventListener("click", () => {
  moveBaby();
});

// Game loop
setInterval(moveMom, 50);

// Initial placement
baby.style.left = babyX + "px";
baby.style.top = babyY + "px";
mom.style.left = momX + "px";
mom.style.top = momY + "px";
</script>

</body>
</html>
