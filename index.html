<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mommy Pakdo Baby</title>

<style>
* {
  box-sizing: border-box;
  touch-action: manipulation;
  user-select: none;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: linear-gradient(#70cfff, #d9f5ff);
}

#title {
  position: absolute;
  top: 12px;
  width: 100%;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #333;
  z-index: 10;
}

#score {
  position: absolute;
  top: 55px;
  left: 15px;
  background: white;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: bold;
  z-index: 10;
}

.character {
  position: absolute;
  font-size: 58px;
  transition: left 0.08s linear, top 0.08s linear;
  z-index: 5;
}

#baby {
  z-index: 6;
}

#mom {
  z-index: 5;
}

#phone {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  font-size: 18px;
  font-weight: bold;
  z-index: 20;
}

#message {
  position: absolute;
  top: 105px;
  width: 100%;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  color: #333;
  z-index: 10;
}
</style>
</head>

<body>

<div id="game">

  <div id="title">😂 Mommy Pakdo Baby 😂</div>

  <div id="score">
    Score: <span id="points">0</span>
  </div>

  <div id="message">
    Baby ko pakdo! 👶
  </div>

  <div id="baby" class="character">👶</div>
  <div id="mom" class="character">👩</div>

  <button id="phone">📱 RUN BABY!</button>

</div>

<script>
const game = document.getElementById("game");
const baby = document.getElementById("baby");
const mom = document.getElementById("mom");
const pointsText = document.getElementById("points");
const message = document.getElementById("message");
const button = document.getElementById("phone");

let points = 0;

let babyX = 60;
let babyY = 220;

let momX = 250;
let momY = 450;

function moveBaby() {
  const maxX = window.innerWidth - 80;
  const maxY = window.innerHeight - 150;

  babyX = Math.random() * maxX;
  babyY = 130 + Math.random() * (maxY - 130);

  baby.style.left = babyX + "px";
  baby.style.top = babyY + "px";

  points++;
  pointsText.textContent = points;

  message.textContent = "😂 Baby bhaag gaya! Pakdo!";

  checkDistance();
}

function moveMom() {
  const dx = babyX - momX;
  const dy = babyY - momY;

  momX += dx * 0.08;
  momY += dy * 0.08;

  mom.style.left = momX + "px";
  mom.style.top = momY + "px";

  checkDistance();
}

function checkDistance() {
  const distance = Math.sqrt(
    Math.pow(babyX - momX, 2) +
    Math.pow(babyY - momY, 2)
  );

  if (distance < 55) {
    message.textContent = "🎉 Mommy ne Baby ko pakad liya! 🎉";
    points = 0;
    pointsText.textContent = points;

    setTimeout(() => {
      message.textContent = "👶 Baby phir se bhaag gaya!";
      moveBaby();
    }, 1200);
  }
}

button.addEventListener("click", moveBaby);

game.addEventListener("touchstart", function(e) {
  if (e.target === button) return;
  moveBaby();
});

game.addEventListener("click", function(e) {
  if (e.target === button) return;
  moveBaby();
});

setInterval(moveMom, 100);

baby.style.left = babyX + "px";
baby.style.top = babyY + "px";

mom.style.left = momX + "px";
mom.style.top = momY + "px";
</script>

</body>
</html>
