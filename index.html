* {
  box-sizing: border-box;

}

  width: 100vw;

  position: relative;
  overflow: hidden;

}

#title {

  top: 12px;

  font-size: 25px;

  color: #333;
  z-index: 10;
}

#score {
  position: absolute;
  top: 55px;
  left: 15px;

  padding: 8px 14px;
  border-radius: 20px;
  font-weight: bold;
  z-index: 10;
}

.character {
  position: absolute;
  font-size: 58px;
  user-select: none;
  transition: left 0.08s linear, top 0.08s linear;
}

}
