<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mommy Pakdo Baby</title>

<!-- Google Font for Premium Gaming Look -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  touch-action: manipulation;
  user-select: none;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: #0f172a;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
}

#title {
  position: absolute;
  top: 15px;
  width: 100%;
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  color: #38bdf8;
  text-shadow: 0 2px 10px rgba(56, 189, 248, 0.4);
  z-index: 10;
  letter-spacing: 1px;
}

#score {
  position: absolute;
  top: 60px;
  left: 20px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  padding: 8px 18px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 15px;
  z-index: 10;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

#message {
  position: absolute;
  top: 105px;
  width: 100%;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: #fbbf24;
  text-shadow: 0 2px 8px rgba(251, 191, 36, 0.3);
  z-index: 10;
  padding: 0 15px;
}

.character {
  position: absolute;
  font-size: 50px;
  width: 60px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4));
  transition: transform 0.05s linear;
}

#phone {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
  color: white;
  border: none;
  border-radius: 40px;
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
  z-index: 20;
  box-shadow: 0 6px 20px rgba(225, 29, 72, 0.5);
  cursor: pointer;
  transition: transform 0.1s ease;
}

#phone:active {
  transform: translateX(-50%) scale(0.95);
}
</style>
</head>

<body>

<div id="game">

  <div id="title">⚡ MOMMY PAKDO BABY ⚡</div>

  <div id="score">
    Score: <span id="points">0</span>
  </div>

  <div id="message">
    Baby ko pakdo! 👶
  </div>

  <div id="baby" class="character">👶</div>
  <div id="mom" class="character">👩</div>

  <button id="phone">🚀 RUN BABY!</button>

</div>

<script>
const game = document.getElementById("game");
const baby = document.getElementById("baby");
const mom = document.getElementById("mom");
const pointsText = document.getElementById("points");
const message = document.getElementById("message");
const button = document.getElementById("phone");

let points = 0;

let babyX = window.innerWidth / 2 - 50;
let babyY = window.innerHeight / 2 - 50;

let momX = window.innerWidth / 2 + 50;
let momY = window.innerHeight / 2 + 50;

function moveBaby() {
  const maxX = window.innerWidth - 70;
  const maxY = window.innerHeight - 140;

  babyX = 20 + Math.random() * (maxX - 40);
  babyY = 150 + Math.random() * (maxY - 190);

  baby.style.left = babyX + "px";
  baby.style.top = babyY + "px";

  points++;
  pointsText.textContent = points;

  message.textContent = "🔥 Baby bhaag gaya! Pakdo!";
}

function moveMom() {
  const dx = babyX - momX;
  const dy = babyY - momY;

  momX += dx * 0.07;
  momY += dy * 0.07;

  mom.style.left = momX + "px";
  mom.style.top = momY + "px";

  checkDistance();
}

function checkDistance() {
  const distance = Math.sqrt(
    Math.pow(babyX - momX, 2) +
    Math.pow(babyY - momY, 2)
  );

  if (distance < 50) {
    message.textContent = "🏆 Mommy ne pakad liya! Awesome!";
    points = 0;
    pointsText.textContent = points;

    setTimeout(() => {
      message.textContent = "⚡ Baby phir se bhaag gaya!";
      moveBaby();
    }, 1000);
  }
}

button.addEventListener("click", (e) => {
  e.stopPropagation();
  moveBaby();
});

game.addEventListener("click", () => {
  moveBaby();
});

setInterval(moveMom, 50);

baby.style.left = babyX + "px";
baby.style.top = babyY + "px";
mom.style.left = momX + "px";
mom.style.top = momY + "px";
</script>

</body>
</html>
